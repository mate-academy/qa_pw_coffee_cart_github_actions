name: Coffee-cart testing workflow

on:
 push:
   branches:
     - main
 pull_request:
   branches:
     - main

jobs:
 e2e-testing:
   runs-on: ubuntu-latest

   steps:
     - name: Check out the repository
       uses: actions/checkout@v4

     - name: Build Docker image
       run: docker build -t e2e-tests .

     - name: Run e2e tests
       run: |
         docker run e2e-tests

     - name: Run e2e tests
       run: |
         docker run -v $PWD/allure_results:/allure_results e2e-tests
"scripts": {
   "prepare": "husky",
   "test-staging": "ENV_TYPE=staging npx playwright test",
   "test-staging-ui": "ENV_TYPE=staging npx playwright test --ui",
   "test-ci": "mkdir /allure_results; ENV_TYPE=staging ALLURE_RESULTS_DIR=/allure_results npx playwright test"
 },
export default defineConfig({
 reporter: [['list'], [
   'allure-playwright', { resultsDir: process.env.ALLURE_RESULTS_DIR || 'allure-results' }
 ]],

    
- name: Upload Allure Results as Artifact
       uses: actions/upload-artifact@v4
       with:
         name: allure_results
         path: allure_results
